; Three environments (wm, sm, uv) plus *_fi variants with fault injection and a desktop test env.
; Versions are pinned: every test record must name the firmware commit (see tools/fw_version.py).
[platformio]
src_dir = .
default_envs = wm, sm, uv

[common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -I.
extra_scripts = pre:../tools/fw_version.py
; Libraries are added when the module logic needs them, pinned at that time:
;   HX711 (bogde), OneWire + DallasTemperature, ESP32Encoder, Adafruit SSD1306 + GFX (SM), Adafruit MLX90614 (UV)

[env:wm]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
build_src_filter = -<*> +<common/*.cpp> +<wm/*.cpp> -<wm/test_*>

[env:sm]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
build_src_filter = -<*> +<common/*.cpp> +<sm/*.cpp>

[env:uv]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}
build_src_filter = -<*> +<common/*.cpp> +<uv/*.cpp>

; ---- fault-injection builds: ONLY for the error-rate (detection) tests, never for normal runs ----
[env:wm_fi]
extends = env:wm
build_flags = ${common.build_flags} -DENABLE_FAULT_INJECTION=1

[env:sm_fi]
extends = env:sm
build_flags = ${common.build_flags} -DENABLE_FAULT_INJECTION=1

[env:uv_fi]
extends = env:uv
build_flags = ${common.build_flags} -DENABLE_FAULT_INJECTION=1
